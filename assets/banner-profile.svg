      <circle cx="416" cy="262" r="4.5" fill="#0E7C7B"/><text x="427" y="266" fill="#C7D2DD">Données d'enquête</text>
      <circle cx="572" cy="262" r="4.5" fill="#E8A33D"/><text x="583" y="266" fill="#C7D2DD">Économétrie</text>
