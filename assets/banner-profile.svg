      <text x="56" y="72" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-2" fill="#F4EDE4">NC</text>
      <path d="M24 94 L44 86 L64 89 L88 78" fill="none" stroke="#0E7C7B" stroke-width="3.5" stroke-linecap="round"/>
