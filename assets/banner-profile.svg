      <stop offset="0" stop-color="#0F1E2E"/><stop offset="1" stop-color="#12283C"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="320" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C75B12"/><stop offset="1" stop-color="#E8A33D"/>
    </linearGradient>
    <clipPath id="fr"><rect width="1280" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#fr)">
